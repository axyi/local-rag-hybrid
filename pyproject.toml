[project]
name = "local-rag-hybrid"
version = "0.1.0"
description = "Hybrid-search (vector + BM25 + RRF) local RAG assistant — course assignment 4"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "faiss-cpu==1.15.0",
    "sentence-transformers==6.0.0",
    "torch==2.13.0",
    "rank-bm25==0.2.2",
    "snowballstemmer==3.1.1",
    "fastmcp==3.4.7",
    "ollama==0.6.2",
    "tiktoken==0.14.0",
    "pypdf==6.16.2",
    "python-docx==1.2.0",
    "rich==15.0.0",
    "requests==2.34.2",
    "numpy==2.5.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["src/mcp", "src/assistant.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/**" = ["E402"]
"src/rag/chunk.py" = ["I001"]
"src/rag/embed.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
